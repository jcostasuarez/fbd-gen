[package]
name = "fbd-gen"
version = "0.1.0"
edition = "2024"
# Let-chains (`if let ... && let ...`). Lo verifica el job `msrv` del CI.
rust-version = "1.88"
description = "Genera secciones FBD de Control Expert a partir de un grafo semántico, con layout Sugiyama en celdas enteras"
license = "MIT"
repository = "https://github.com/jcostasuarez/fbd-gen"

[features]
default = ["cli", "embedded-library"]
# Ejecutable de línea de comandos. Desactivarlo al usar el crate como librería.
cli = ["dep:anyhow", "dep:clap", "embedded-library"]
# Incluye efb_dimensions.json en el binario (`Library::embedded`, ~0,5 MB).
embedded-library = []

[[bin]]
name = "fbd-gen"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
roxmltree = "0.20"
