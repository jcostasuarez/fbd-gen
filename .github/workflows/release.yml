name: Release

# Publica la versión de Cargo.toml cuando todavía no tiene release:
# - al llegar a `main` (merge de un PR que sube `version`), crea el tag `vX.Y.Z` y el
#   release; si el tag ya existe no hace nada más que verificarlo;
# - al subir a mano un tag `vX.Y.Z`, que tiene que coincidir con Cargo.toml;
# - a pedido (`workflow_dispatch`) desde `main`.
# Compila los ejecutables y crea el release de GitHub con las notas de esa versión en
# CHANGELOG.md. Ver "Publicar una versión" en el README.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Dos merges seguidos no publican la misma versión dos veces.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Versión a publicar
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "fbd-gen") | .version')"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la versión de Cargo.toml (${version})"
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Solo se publica desde main, no desde ${GITHUB_REF_NAME}"
            exit 1
          elif [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "${tag} ya existe: nada que publicar."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene la sección ## [${version}]"
            exit 1
          fi
          echo "Se publica ${tag}."
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.release == 'true'
      - if: steps.version.outputs.release == 'true'
        run: cargo test --all-targets --locked
      - if: steps.version.outputs.release == 'true'
        run: cargo package --locked

  build:
    name: Ejecutable (${{ matrix.target }})
    needs: verify
    if: needs.verify.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows es donde corre Control Expert. CRT estático: no necesita el
          # redistribuible de Visual C++.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          # musl: estático, corre en cualquier distribución.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      NAME: fbd-gen-v${{ needs.verify.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p "dist/${NAME}"
          exe=fbd-gen
          if [ "${{ runner.os }}" = "Windows" ]; then exe=fbd-gen.exe; fi
          cp "target/${{ matrix.target }}/release/${exe}" "dist/${NAME}/"
          cp README.md CHANGELOG.md LICENSE "dist/${NAME}/"
          cp -r examples "dist/${NAME}/"
          rm -f "dist/${NAME}"/examples/*.rs
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}" > /dev/null
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release de GitHub
    needs: [verify, build]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notas y sumas SHA-256
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # La sección de esta versión, sin su encabezado, hasta la siguiente.
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat notes.md
          cat dist/SHA256SUMS.txt
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        # Si el tag no existe, gh lo crea en este commit. Un tag creado con
        # GITHUB_TOKEN no vuelve a disparar este workflow.
        run: |
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "fbd-gen ${VERSION}" \
            --notes-file notes.md
